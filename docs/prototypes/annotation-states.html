<div id="acanvas-annotation-preview">
  <div class="viz-controls annotation-review-toolbar" aria-label="Design review controls">
    <div class="viz-row" aria-label="Annotation states">
      <button type="button" class="btn" data-preview-state="new" aria-pressed="false">新建</button>
      <button type="button" class="btn" data-preview-state="summary" aria-pressed="true">常态短评</button>
      <button type="button" class="btn" data-preview-state="read" aria-pressed="false">选中阅读</button>
      <button type="button" class="btn" data-preview-state="edit" aria-pressed="false">编辑</button>
    </div>
    <label class="form-label">素材场景
      <select class="form-select" id="acanvas-preview-scene">
        <option value="single">单素材</option>
        <option value="multi" selected>多素材</option>
        <option value="video">视频</option>
        <option value="dense">密集批注</option>
        <option value="edge">边缘</option>
      </select>
    </label>
  </div>

  <section id="acanvas-prototype" aria-label="acanvas — Coast project">
    <header class="ac-topbar">
      <span class="ac-wordmark">acanvas</span>
      <span class="ac-project">Coast / 海岸系列</span>
    </header>
    <div class="ac-viewport" aria-label="Project canvas">
      <div class="ac-source-assembly" id="acanvas-source-assembly">
        <div class="ac-annotations" id="acanvas-annotations" aria-label="Creative instructions"></div>
        <div class="ac-source-grid" id="acanvas-sources" aria-label="Selected source materials"></div>
        <div class="ac-source-caption" id="acanvas-source-caption">Coast studies · 3 sources</div>
      </div>
    </div>
    <div class="ac-bottom">
      <div class="ac-task-context" id="acanvas-task-context"></div>
      <div class="ac-composer">
        <div class="ac-chip-row" id="acanvas-chips" aria-label="Annotation references"></div>
        <label class="ac-sr-only" for="acanvas-request">Request</label>
        <textarea id="acanvas-request" rows="1" placeholder="Describe your request">整理成一组海岸主题海报。</textarea>
        <div class="ac-composer-footer">
          <span class="ac-context-label" id="acanvas-context-label">Draft · 2 instructions</span>
          <div class="ac-task-actions" id="acanvas-task-actions"></div>
        </div>
      </div>
    </div>
    <div class="ac-sr-only" id="acanvas-announcement" aria-live="polite"></div>
  </section>
</div>

<style>
  #acanvas-annotation-preview { width: 100%; background: transparent; }

  #acanvas-prototype .ac-fulltext, #acanvas-prototype .ac-annotation-input { margin: 0; width: 100%; flex: 1; min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 22px; }
  #acanvas-prototype .ac-annotation-input { resize: none; }
  #acanvas-prototype .ac-fulltext { overflow-y: auto; }
  #acanvas-prototype .ac-full-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; margin-top: 8px; }
  #acanvas-prototype .ac-thumbnail-row { display: flex; gap: 4px; align-items: center; }
  #acanvas-prototype .ac-thumb { position: relative; display: block; width: 28px; height: 28px; overflow: hidden; }

  #acanvas-prototype .ac-inline-action { display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 0; padding: 4px 6px; border-radius: 5px; color: var(--ac-muted); background: transparent; font-size: 12px; white-space: nowrap; }
  #acanvas-prototype .ac-inline-action:hover { color: var(--ac-text); background: var(--ac-soft); }
  #acanvas-prototype .ac-source-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; }
  #acanvas-prototype .ac-source { margin: 0; position: relative; min-width: 0; }
  #acanvas-prototype .ac-source > .ac-art { aspect-ratio: 4 / 5; max-height: 205px; }
  #acanvas-prototype .ac-source-caption { margin-top: 10px; color: var(--ac-muted); font-size: 11px; }
  #acanvas-prototype .ac-art { position: relative; overflow: hidden; background: #e9e4d4; color: #123b55; }
  #acanvas-prototype .ac-art-shape { position: absolute; display: block; }
  #acanvas-prototype .ac-art-blue { background: #d0dfe0; }
  #acanvas-prototype .ac-art-blue .ac-art-shape { width: 104%; height: 73%; left: -12%; top: -10%; border-radius: 48% 35% 45% 18%; transform: rotate(-21deg); background: #205575; }
  #acanvas-prototype .ac-art-blue::after { content: ""; position: absolute; width: 34%; height: 29%; right: 7%; top: 27%; border-radius: 50%; background: #eee8d6; }
  #acanvas-prototype .ac-art-warm { background: #ede5d2; }
  #acanvas-prototype .ac-art-warm .ac-art-shape { width: 122%; height: 80%; left: 12%; top: -13%; border-radius: 45% 42% 50% 30%; transform: rotate(28deg); background: #c96c36; }
  #acanvas-prototype .ac-art-warm::after { content: ""; position: absolute; width: 50%; height: 23%; left: -8%; top: 43%; border-radius: 50%; background: #355c6a; transform: rotate(-20deg); }
  #acanvas-prototype .ac-art-texture { background: #315b6b; color: #f0e8d2; }
  #acanvas-prototype .ac-art-texture .ac-art-shape { width: 120%; height: 54%; top: 8%; left: -10%; background: repeating-linear-gradient(165deg, #93afb2 0 2px, #6f929c 2px 9px, #315b6b 9px 13px); transform: rotate(-12deg); }
  #acanvas-prototype .ac-art-type { position: absolute; z-index: 1; left: 12px; right: 10px; bottom: 23px; font-family: Georgia, serif; font-size: 21px; line-height: 1; letter-spacing: -.5px; }
  #acanvas-prototype .ac-art-subtitle { position: absolute; z-index: 1; left: 13px; bottom: 10px; font-size: 11px; letter-spacing: .5px; }
  #acanvas-prototype .ac-art-frame { background: #c7d7d8; }
  #acanvas-prototype .ac-art-frame .ac-art-shape { width: 120%; height: 74%; left: -6%; top: 30%; border-radius: 50% 40% 0 0; background: #37677c; transform: rotate(-8deg); }
  #acanvas-prototype .ac-art-frame::after { content: ""; position: absolute; width: 52%; height: 20%; left: 30%; top: 45%; border-radius: 50%; background: #e8ddbe; transform: rotate(-8deg); }
  #acanvas-prototype .ac-video-time { position: absolute; right: 10px; bottom: 10px; z-index: 2; padding: 2px 6px; border-radius: 4px; color: #ffffff; background: #143b50; font-size: 12px; }
  #acanvas-prototype[data-scene="single"] .ac-source-grid { grid-template-columns: minmax(0, 220px); }
  #acanvas-prototype[data-scene="video"] .ac-source-grid { grid-template-columns: minmax(0, 380px); }
  #acanvas-prototype[data-scene="video"] .ac-source > .ac-art { aspect-ratio: 16 / 9; }
  #acanvas-prototype[data-scene="dense"] .ac-viewport { height: 494px; }
  #acanvas-prototype[data-scene="dense"] .ac-source-assembly { top: 274px; }
  #acanvas-prototype[data-scene="edge"] .ac-viewport { overflow: hidden; }
  #acanvas-prototype[data-scene="edge"]:not(.is-located) .ac-source-assembly { left: calc(50% + 430px); }
  #acanvas-prototype .ac-bottom { padding: 0 24px 22px; width: min(580px, 100%); margin: 0 auto; }
  #acanvas-prototype .ac-task-context { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 34px; margin: 0 8px 8px; font-size: 12px; }
  #acanvas-prototype .ac-task-context .ac-task-meta { display: flex; align-items: center; gap: 8px; color: var(--ac-muted); }
  #acanvas-prototype .ac-queue-number { color: var(--ac-text); }
  #acanvas-prototype .ac-composer { padding: 12px 14px 10px; border-radius: 12px; background: var(--ac-surface); box-shadow: 0 3px 20px light-dark(#0000000c, #00000022); }
  #acanvas-prototype .ac-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
  #acanvas-prototype .ac-chip-group { display: inline-flex; align-items: center; flex-wrap: wrap; min-width: 0; max-width: 100%; gap: 2px; }
  #acanvas-prototype .ac-chip { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: min(226px, 100%); padding: 4px 7px; border: 0; border-radius: 5px; background: var(--ac-soft); font-size: 12px; }
  #acanvas-prototype .ac-chip[aria-pressed="true"] { background: var(--ac-blue-soft); }
  #acanvas-prototype .ac-chip-id { color: var(--ac-blue); font-weight: 500; }
  #acanvas-prototype .ac-chip-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #acanvas-prototype #acanvas-request { display: block; resize: none; width: 100%; min-height: 34px; padding: 0; border: 0; background: transparent; font-size: 13px; line-height: 22px; }
  #acanvas-prototype .ac-composer-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  #acanvas-prototype .ac-context-label { color: var(--ac-muted); font-size: 11px; }
  #acanvas-prototype .ac-task-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  #acanvas-prototype .ac-action { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 10px; border: 0; border-radius: 7px; background: var(--ac-soft); font-size: 12px; }
  #acanvas-prototype .ac-action-primary { color: var(--ac-button-text); background: var(--ac-button); }
  #acanvas-prototype .ac-action:hover { filter: brightness(.94); }
  #acanvas-prototype .ac-sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 500px) {
    #acanvas-prototype .ac-topbar { padding: 16px 16px 6px; flex-wrap: wrap; gap: 6px 12px; }
    #acanvas-prototype .ac-viewport { height: 486px; }
    #acanvas-prototype .ac-source-assembly { top: 302px; width: calc(100% - 32px); }
    #acanvas-prototype[data-scene="dense"] .ac-source-assembly { top: 302px; }
    #acanvas-prototype[data-scene="dense"] .ac-viewport { height: 486px; }
    #acanvas-prototype .ac-fullbody { height: 192px; }
    #acanvas-prototype .ac-source-grid { gap: 8px; }
    #acanvas-prototype .ac-art-type { font-size: 15px; left: 8px; bottom: 21px; }
    #acanvas-prototype .ac-art-subtitle { left: 8px; letter-spacing: 0; font-size: 11px; }
    #acanvas-prototype .ac-source-caption { margin-top: 8px; }
    #acanvas-prototype .ac-bottom { padding: 0 16px 18px; }
    #acanvas-prototype .ac-full-footer { flex-wrap: wrap; }
    #acanvas-prototype[data-scene="edge"]:not(.is-located) .ac-source-assembly { left: calc(50% + 265px); }
  }
  @media (pointer: coarse) {
    #acanvas-prototype .ac-number { min-width: 32px; height: 32px; }
    #acanvas-prototype .ac-summary, #acanvas-prototype .ac-inline-action, #acanvas-prototype .ac-chip, #acanvas-prototype .ac-action { min-height: 44px; }
    #acanvas-prototype .ac-annotation { min-height: 44px; }
    #acanvas-prototype .ac-annotations { gap: 2px; }
    #acanvas-prototype .ac-annotation-input, #acanvas-prototype #acanvas-request { font-size: 16px; }
    #acanvas-prototype .ac-viewport { height: 630px; }
    #acanvas-prototype .ac-source-assembly { top: 382px; }
    #acanvas-prototype[data-scene="dense"] .ac-source-assembly { top: 382px; }
    #acanvas-prototype[data-scene="dense"] .ac-viewport { height: 630px; }
    #acanvas-prototype .ac-fullbody { height: 230px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #acanvas-prototype * { scroll-behavior: auto; }
  }
</style>

<script>
(() => {
  const preview = document.getElementById('acanvas-annotation-preview');
  const product = document.getElementById('acanvas-prototype');
  const assembly = document.getElementById('acanvas-source-assembly');
  const annotationLayer = document.getElementById('acanvas-annotations');
  const sources = document.getElementById('acanvas-sources');
  const chips = document.getElementById('acanvas-chips');
  const taskContext = document.getElementById('acanvas-task-context');
  const actions = document.getElementById('acanvas-task-actions');
  const request = document.getElementById('acanvas-request');
  const label = document.getElementById('acanvas-context-label');
  const announcement = document.getElementById('acanvas-announcement');
  const sceneSelect = document.getElementById('acanvas-preview-scene');
  const seed = {
    1: '保留冷色调与留白，以第一张的构图为主。\n融合第二张的暖色点缀，避免提高整体饱和度。',
    2: '保留这个区域的纹理，减少装饰元素。',
    3: '让文字与海岸曲线保持呼应。',
    4: '延续浅色背景中的呼吸感。'
  };
  const model = {
    scene: 'multi', view: 'summary', context: 'draft', active: null, located: false,
    sampleDraft: { 1: seed[1], 2: seed[2] }, newDraft: { 1: '', 2: '' }, draftKind: 'sample',
    task: { 1: seed[1], 2: seed[2] }, editDraft: null, taskRequest: '整理成一组海岸主题海报。',
    ordinaryRequest: '整理成一组海岸主题海报。', savedRequest: null, frame: '00:18', origin: null
  };
  const sourceData = {
    blue: { kind: 'blue', name: 'Coast blue study', title: 'Coast', subtitle: 'STUDY 01' },
    warm: { kind: 'warm', name: 'Coast warm study', title: 'Tide', subtitle: 'STUDY 02' },
    texture: { kind: 'texture', name: 'Coast texture study', title: 'Shore', subtitle: 'STUDY 03' },
    frame: { kind: 'frame', name: 'Coast motion study, frame at 00:42', title: '', subtitle: '' }
  };
  const proportions = { summaryWidth: 220, fullWidth: 360 };
  function currentTexts() {
    if (model.context === 'task') return model.task;
    if (model.context === 'task-edit') return model.editDraft;
    return model.draftKind === 'new' ? model.newDraft : model.sampleDraft;
  }
  function visibleIds() {
    const ids = model.scene === 'dense' ? [1, 2, 3, 4] : [1, 2];
    return ids.filter(id => currentTexts()[id].trim() || model.active === id || (model.context === 'draft' && model.draftKind === 'new' && model.view === 'new' && id === 1));
  }
  function summary(text) { return text.split('\n').find(line => line.trim()) || 'Add a comment'; }
  function applySceneRecords() {
    [model.sampleDraft, model.newDraft, model.task, model.editDraft].filter(Boolean).forEach(records => {
      if (model.scene === 'dense') {
        records[3] = seed[3]; records[4] = seed[4];
      } else {
        delete records[3]; delete records[4];
      }
    });
    if (model.active > 2 && model.scene !== 'dense') model.active = 1;
  }
  function refs(id) {
    if (model.scene === 'single') return ['blue'];
    if (model.scene === 'video') return ['frame'];
    return id === 1 ? ['blue', 'warm'] : id === 2 ? ['texture'] : id === 3 ? ['blue'] : ['warm'];
  }
  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function button(text, className, action) {
    const node = element('button', className + ' cursor-interaction', text);
    node.type = 'button';
    node.addEventListener('click', action);
    return node;
  }
  function art(key, thumbnail = false) {
    const source = sourceData[key];
    const node = element('div', 'ac-art ac-art-' + source.kind);
    node.setAttribute('role', 'img');
    node.setAttribute('aria-label', source.name + (thumbnail ? ' thumbnail' : ' — abstract design sample'));
    node.append(element('span', 'ac-art-shape'));
    if (!thumbnail && source.title) {
      node.append(element('span', 'ac-art-type', source.title), element('span', 'ac-art-subtitle', source.subtitle));
    }
    return node;
  }
  function announce(text) { announcement.textContent = text; }
  function isOffscreen() { return model.scene === 'edge' && !model.located; }
  function focusEditor() {
    if (isOffscreen()) return;
    const input = annotationLayer.querySelector('textarea');
    if (input) input.focus({ preventScroll: true });
  }
  function selectAnnotation(id, origin) {
    model.active = id;
    model.origin = origin || null;
    model.view = model.context === 'task' ? 'read' : 'edit';
    render();
    focusEditor();
    announce('Instruction ' + id + ' selected');
  }
  function finishAnnotation() {
    const id = model.active;
    model.active = null;
    model.view = 'summary';
    render();
    const returnTo = preview.querySelector('[data-chip-id="' + id + '"]') || annotationLayer.querySelector('[data-number-id="' + id + '"]') || request;
    returnTo.focus({ preventScroll: true });
    announce('Instruction ' + id + (model.context === 'task' ? ' closed' : ' kept in draft'));
  }
  function beginTaskEdit() {
    if (model.context === 'draft') model.ordinaryRequest = request.value;
    model.editDraft = { ...model.task };
    model.savedRequest = model.taskRequest;
    model.context = 'task-edit';
    model.active = model.active || 1;
    model.view = 'edit';
    request.value = model.taskRequest;
    render();
    focusEditor();
    announce('Request 21 editing');
  }
  function saveTaskEdit() {
    model.task = { ...model.editDraft };
    model.taskRequest = request.value;
    model.editDraft = null;
    model.context = 'task';
    model.view = model.active ? 'read' : 'summary';
    render();
    request.focus({ preventScroll: true });
    announce('Request 21 updated');
  }
  function cancelTaskEdit() {
    model.editDraft = null;
    model.context = 'task';
    model.view = model.active ? 'read' : 'summary';
    request.value = model.taskRequest;
    render();
    request.focus({ preventScroll: true });
    announce('Request 21 restored');
  }
  function sendTask() {
    const texts = currentTexts();
    if (!Object.values(texts).some(text => text.trim()) && !request.value.trim()) {
      announce('Add a request or an instruction');
      return;
    }
    model.task = { ...texts };
    model.taskRequest = request.value;
    model.ordinaryRequest = '';
    model.context = 'task';
    model.active = visibleIds()[0] || null;
    model.view = model.active ? 'read' : 'summary';
    render();
    request.focus({ preventScroll: true });
    announce('Request 21 queued');
  }
  function locate() {
    model.located = true;
    product.classList.add('is-located');
    renderBottom();
    focusEditor();
    announce('Selected sources located');
  }
  function renderSources() {
    sources.replaceChildren();
    const keys = model.scene === 'single' ? ['blue'] : model.scene === 'video' ? ['frame'] : ['blue', 'warm', 'texture'];
    keys.forEach(key => {
      const figure = element('figure', 'ac-source');
      figure.append(art(key));
      if (key === 'frame') figure.append(element('span', 'ac-video-time', model.frame));
      sources.append(figure);
    });
    document.getElementById('acanvas-source-caption').textContent = model.scene === 'video' ? 'Coast motion study · frame ' + model.frame : 'Coast studies · ' + keys.length + (keys.length === 1 ? ' source' : ' sources');
  }
  function renderAnnotations() {
    annotationLayer.replaceChildren();
    visibleIds().forEach(id => {
      const texts = currentTexts();
      const expanded = model.active === id && model.view !== 'summary';
      const row = element('div', 'ac-annotation' + (expanded ? ' is-expanded' : ''));
      row.dataset.annotationId = id;
      const number = button(String(id), 'ac-number', () => selectAnnotation(id, 'number'));
      number.dataset.numberId = id;
      number.setAttribute('aria-label', 'Instruction ' + id);
      number.setAttribute('aria-expanded', String(expanded));
      row.append(number);
      if (expanded) {
        const body = element('div', 'ac-fullbody');
        body.dataset.fullbody = id;
        if (model.context !== 'task') {
          const input = element('textarea', 'ac-annotation-input');
          input.value = texts[id];
          input.placeholder = 'Add a comment';
          input.setAttribute('aria-label', 'Instruction ' + id + ' comment');
          input.addEventListener('input', () => {
            currentTexts()[id] = input.value;
            const chipLabel = chips.querySelector('[data-chip-id="' + id + '"] .ac-chip-label');
            if (chipLabel) chipLabel.textContent = summary(input.value);
          });
          input.addEventListener('keydown', event => {
            if (event.isComposing) return;
            if (event.key === 'Escape' || (event.key === 'Enter' && (event.ctrlKey || event.metaKey))) {
              event.preventDefault(); finishAnnotation();
            }
          });
          body.append(input);
        } else body.append(element('p', 'ac-fulltext', texts[id]));
        const footer = element('div', 'ac-full-footer');
        const thumbnails = element('div', 'ac-thumbnail-row');
        refs(id).forEach(key => {
          const thumb = element('span', 'ac-thumb');
          thumb.append(art(key, true));
          thumbnails.append(thumb);
        });
        footer.append(thumbnails);
        if (model.scene === 'video') {
          footer.append(button('Jump to 00:42', 'ac-inline-action', () => { model.frame = '00:42'; renderSources(); announce('Frame 00:42 selected'); }));
        }
        footer.append(button(model.context === 'task' ? 'Close' : 'Done', 'ac-inline-action', finishAnnotation));
        body.append(footer);
        row.append(body);
      } else {
        const short = button(summary(texts[id]), 'ac-summary', () => selectAnnotation(id, 'summary'));
        short.setAttribute('aria-label', 'Instruction ' + id + ': ' + summary(texts[id]));
        short.dataset.tooltip = texts[id] || 'Add a comment';
        row.append(short);
      }
      annotationLayer.append(row);
    });
  }
  function renderBottom() {
    chips.replaceChildren();
    visibleIds().forEach(id => {
      const group = element('span', 'ac-chip-group');
      const chip = button('', 'ac-chip', () => selectAnnotation(id, 'chip'));
      chip.dataset.chipId = id;
      chip.setAttribute('aria-pressed', String(model.active === id));
      chip.append(element('span', 'ac-chip-id', String(id)), element('span', 'ac-chip-label', summary(currentTexts()[id])));
      group.append(chip);
      if (isOffscreen()) {
        const locateButton = button('Locate', 'ac-inline-action', locate);
        locateButton.setAttribute('aria-label', 'Locate instruction ' + id);
        group.append(locateButton);
      }
      chips.append(group);
    });
    if (model.context === 'draft' && model.draftKind === 'new' && visibleIds().length < 2) {
      chips.append(button('Add instruction', 'ac-inline-action', () => {
        model.active = currentTexts()[1].trim() ? 2 : 1;
        model.view = 'new'; render(); focusEditor();
      }));
    }
    taskContext.replaceChildren();
    actions.replaceChildren();
    const count = Object.values(currentTexts()).filter(text => text.trim()).length;
    if (model.context === 'draft') {
      label.textContent = 'Draft · ' + count + (count === 1 ? ' instruction' : ' instructions');
      actions.append(button('Send', 'ac-action ac-action-primary', sendTask));
      request.readOnly = false;
    } else {
      const meta = element('div', 'ac-task-meta');
      meta.append(element('span', 'ac-queue-number', 'Request 21'), element('span', '', model.context === 'task-edit' ? 'Editing' : 'Queued'));
      taskContext.append(meta);
      if (model.context === 'task') taskContext.append(button('Edit', 'ac-inline-action', beginTaskEdit));
      label.textContent = model.context === 'task-edit' ? 'Request 21 · editing' : 'Request 21 · ' + count + ' instructions';
      if (model.context === 'task-edit') {
        actions.append(button('Cancel edit', 'ac-action', cancelTaskEdit), button('Save edit', 'ac-action ac-action-primary', saveTaskEdit));
        request.readOnly = false;
      } else request.readOnly = true;
    }
  }
  function render() {
    product.dataset.scene = model.scene;
    product.dataset.context = model.context;
    product.classList.toggle('is-located', model.located);
    renderAnnotations();
    renderBottom();
    const selectedPreview = model.view === 'new' ? 'new' : model.view;
    preview.querySelectorAll('[data-preview-state]').forEach(node => node.setAttribute('aria-pressed', String(node.dataset.previewState === selectedPreview)));
  }
  preview.querySelectorAll('[data-preview-state]').forEach(node => {
    node.addEventListener('click', () => {
      const state = node.dataset.previewState;
      if (model.context === 'draft') model.ordinaryRequest = request.value;
      if (state === 'new') {
        model.context = 'draft'; model.draftKind = 'new'; model.active = 1; model.view = 'new';
        request.value = model.ordinaryRequest;
      } else if (state === 'summary') {
        model.context = 'draft'; model.draftKind = 'sample'; model.active = null; model.view = 'summary';
        request.value = model.ordinaryRequest;
      } else if (state === 'read') {
        model.context = 'task'; model.active = 1; model.view = 'read'; request.value = model.taskRequest;
      } else { beginTaskEdit(); return; }
      render();
      if (state === 'new') focusEditor();
    });
  });
  sceneSelect.addEventListener('change', () => {
    model.scene = sceneSelect.value; model.located = false;
    applySceneRecords();
    renderSources(); render();
    announce(sceneSelect.options[sceneSelect.selectedIndex].text + ' selected');
  });
  request.addEventListener('input', () => {
    if (model.context === 'draft') model.ordinaryRequest = request.value;
  });
  request.addEventListener('keydown', event => {
    if (event.isComposing || event.shiftKey || event.ctrlKey || event.metaKey || event.key !== 'Enter') return;
    if (model.context === 'draft') { event.preventDefault(); sendTask(); }
  });
  function updateProportions() {
    product.style.setProperty('--annotation-full-width', proportions.fullWidth + 'px');
    product.style.setProperty('--annotation-summary-width', proportions.summaryWidth + 'px');
  }
  renderSources(); render(); updateProportions();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: annotationLayer, onChange: updateProportions });
    tweak.addSlider(proportions, 'summaryWidth', { label: 'Short comment width', min: 160, max: 220, unit: 'px' });
    tweak.addSlider(proportions, 'fullWidth', { label: 'Full comment width', min: 320, max: 360, unit: 'px' });
  }
})();
</script>
