<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Domino · 收拢与展开</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfcfa;color:#242424;font:14px system-ui}.grid{display:grid;grid-template-columns:216px;gap:16px}h1{font-size:13px;font-weight:500;text-align:center;margin:0}.scene{height:192px}svg{display:block}@media(max-width:700px){.grid{grid-template-columns:110px;gap:10px}svg{width:110px;height:110px}.scene{height:110px}h1{font-size:11px}}</style><main class="grid"><section><div class="scene"></div></section></main><script>const variants=[{"name":"B · 收拢","a":-65,"roll":30,"ox":36,"oy":44,"w":24,"h":34,"s":18,"scale":1.05,"fall":4200,"path":"M9.2 0L9.5 0L9.7 0.1L10 0.1L10.3 0.2L10.5 0.3L10.8 0.5L11 0.6L11.2 0.8L11.4 1L11.5 1.2L11.7 1.5L11.8 1.7L11.9 2L11.9 2.3L12 2.5L12 2.8L12 31.2L12 31.5L11.9 31.7L11.9 32L11.8 32.3L11.7 32.5L11.5 32.8L11.4 33L11.2 33.2L11 33.4L10.8 33.5L10.5 33.7L10.3 33.8L10 33.9L9.7 33.9L9.5 34L9.2 34L-9.2 34L-9.5 34L-9.7 33.9L-10 33.9L-10.3 33.8L-10.5 33.7L-10.8 33.5L-11 33.4L-11.2 33.2L-11.4 33L-11.5 32.8L-11.7 32.5L-11.8 32.3L-11.9 32L-11.9 31.7L-12 31.5L-12 31.2L-12 2.8L-12 2.5L-11.9 2.3L-11.9 2L-11.8 1.7L-11.7 1.5L-11.5 1.2L-11.4 1L-11.2 0.8L-11 0.6L-10.8 0.5L-10.5 0.3L-10.3 0.2L-10 0.1L-9.7 0.1L-9.5 0L-9.2 0Z"}];function svg(p,t){const a=p.a*Math.PI/180,e=28*Math.PI/180,scale=p.scale*Math.sqrt(1.6),rr=p.roll*Math.PI/180;const project=([x,y,z])=>{const px=(x*Math.sin(a)-y*Math.cos(a))*scale,py=((x*Math.cos(a)+y*Math.sin(a))*Math.sin(e)-z*Math.cos(e))*scale;return[p.ox+px*Math.cos(rr)-py*Math.sin(rr),p.oy+px*Math.sin(rr)+py*Math.cos(rr)]};let cards=[];for(let i=0;i<15;i++){let phase=(t+i*600)%9000,x=7.5*p.s-phase*p.s/600,age=phase-p.fall,turns=Math.max(0,age/600),whole=Math.floor(turns);let angle=(turns-whole)*Math.asin(p.s/p.h);for(let j=0;j<whole;j++)angle+=Math.asin(p.s/p.h*Math.cos(angle));angle=Math.min(angle,86*Math.PI/180);const o=project([x,0,0]),u=project([x,-1,0]),v=project([x+Math.sin(angle),0,Math.cos(angle)]);const depth=(x+p.h/2*Math.sin(angle))*Math.cos(a)*Math.cos(e)+p.h/2*Math.cos(angle)*Math.sin(e);cards.push({depth,svg:`<path d="${p.path}" transform="matrix(${u[0]-o[0]},${u[1]-o[1]},${v[0]-o[0]},${v[1]-o[1]},${o})" fill="${['#747474','#a0a0a0','#c5c5c5'][i%3]}"/>`});}return `<svg viewBox="0 0 72 64" width="216" height="192">${cards.sort((a,b)=>a.depth-b.depth).map(c=>c.svg).join('')}</svg>`;};const scenes=[...document.querySelectorAll('.scene')];let start;function tick(now){start??=now;scenes.forEach((el,i)=>el.innerHTML=svg(variants[i],matchMedia('(prefers-reduced-motion:reduce)').matches?0:now-start));requestAnimationFrame(tick)}requestAnimationFrame(tick)</script></html>
