<style>:root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color-scheme: light; --page: #eeefeb; --paper: #fafbf7; --ink: #2c3029; --muted: #686e62; --edge: #d9ddd4; --track: #dfe3da; --control: #e9ece4; --shadow: #4f60450b; }
:root[data-theme='dark'] { color-scheme: dark; --page: #171a17; --paper: #202520; --ink: #eef1e9; --muted: #b4bdac; --edge: #3b4439; --track: #424c3d; --control: #30382c; --shadow: #0002; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; padding: 42px 28px 32px; background: var(--page); color: var(--ink); }
main { width: min(880px, 100%); margin: auto; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: transparent; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: .5; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
.page-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 24px; }
.wordmark { font-size: 25px; letter-spacing: -1.2px; font-weight: 650; }
.theme-button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 12px; color: var(--muted); font-size: 12px; border-radius: 10px; }
.theme-button:hover, .replay:hover { background: var(--control); color: var(--ink); }
button svg { width: 17px; height: 17px; flex-shrink: 0; }
.motion { background: var(--paper); border: 1px solid var(--edge); border-radius: 22px; box-shadow: 0 18px 70px var(--shadow); overflow: hidden; }
.figure-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 30px 0; font-size: 11px; letter-spacing: .03em; }
.figure-head h1 { font-size: 13px; margin: 0; font-weight: 500; }
.figure-number { color: var(--muted); font-variant-numeric: tabular-nums; }
.figure-number span { margin-left: 13px; color: var(--ink); }
[data-readout] { color: var(--muted); font-size: 11px; text-align: right; }
.stage { display: flex; align-items: center; justify-content: center; aspect-ratio: 760 / 540; margin: 0 20px; }
.iso-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.iso-solid { filter: url(#card-shadow); }
.iso-fill { fill: var(--card-color); }
.iso-top { fill: url(#surface-light); }
.iso-shade { fill: color-mix(in srgb, var(--card-color), #273021 16%); stroke: color-mix(in srgb, var(--card-color), #273021 16%); stroke-width: .3px; }
.iso-shade[data-shade='1'] { fill: color-mix(in srgb, var(--card-color), #273021 12%); }
.iso-shade[data-shade='2'] { fill: color-mix(in srgb, var(--card-color), #273021 8%); }
.iso-shade[data-shade='3'] { fill: var(--card-color); }
.iso-edge { stroke: color-mix(in srgb, var(--card-color), #273021 8%); stroke-width: .5; fill: none; stroke-linejoin: round; }
.transport { display: flex; align-items: center; gap: 12px; padding: 18px 26px; border-top: 1px solid var(--edge); }
.play { display: flex; align-items: center; justify-content: center; gap: 8px; flex: 0 0 88px; min-height: 42px; padding: 10px 14px; background: var(--ink); color: var(--paper); border-radius: 11px; font-size: 12px; }
.play:hover:not(:disabled) { opacity: .85; }
.play .pause-shape, .play[data-playing='true'] .play-shape { display: none; }
.play[data-playing='true'] .pause-shape { display: block; }
.replay { display: grid; place-items: center; width: 40px; min-height: 42px; flex-shrink: 0; border-radius: 10px; color: var(--muted); }
.timeline-wrap { flex: 1; min-width: 0; padding-inline: 5px; }
#timeline { --progress: 0%; display: block; appearance: none; -webkit-appearance: none; width: 100%; height: 36px; background: transparent; margin: 0; cursor: ew-resize; touch-action: pan-y; }
#timeline::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--ink) 0 var(--progress), var(--track) var(--progress) 100%); }
#timeline::-moz-range-track { height: 4px; border-radius: 4px; background: var(--track); }
#timeline::-moz-range-progress { height: 4px; background: var(--ink); }
#timeline::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; background: var(--ink); border: 2px solid var(--paper); border-radius: 50%; box-shadow: 0 0 0 1px var(--ink); }
#timeline::-moz-range-thumb { width: 9px; height: 9px; background: var(--ink); border: 2px solid var(--paper); border-radius: 50%; box-shadow: 0 0 0 1px var(--ink); }
#elapsed { width: 70px; flex-shrink: 0; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.page-foot { display: flex; justify-content: space-between; gap: 20px; margin-top: 19px; font-size: 10px; line-height: 1.8; color: var(--muted); }
.page-foot p { margin: 0; }
.page-foot .signature { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media (max-width: 540px) {
  body { padding: 24px 16px; }
  .page-head { margin-bottom: 20px; }
  .motion { border-radius: 17px; }
  .figure-head { padding: 20px 20px 0; gap: 8px; }
  .figure-number span { margin-left: 8px; }
  .stage { margin: 10px 0 8px; }
  .transport { padding: 14px 16px; gap: 7px; }
  .play { flex-basis: 42px; width: 42px; padding: 10px; }
  .play span { display: none; }
  .replay { width: 36px; }
  .timeline-wrap { padding-inline: 4px; }
  #elapsed { width: 61px; font-size: 9px; }
  .page-foot { display: block; margin-top: 15px; font-size: 9px; }
  .signature { margin-top: 7px !important; }
}
</style>

.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;

const k = { cameraOf, roundedPlan, extrude, solidSvg };

const DOMINO_DURATION = 8600;
const DOMINO_VIEWBOX = [760, 540];
const DOMINO_CAMERA = { origin: [380, 270], scale: 1.18, azimuth: 45, elevation: 65 };
const DOMINO_CARDS = [
  { name: 'Sage', color: '#8db779', corner: [204, 101], across: [142, -43], down: [17, 242], z: 0, shift: [-27, -9], lean: 0.11 },
  { name: 'Blush', color: '#ff9db6', corner: [268, 156], across: [136, -38], down: [63, 244], z: 24, shift: [0, -5], lean: 0.14 },
  { name: 'Stone', color: '#a5a5a3', corner: [333, 214], across: [132, -36], down: [89, 254], z: 48, shift: [28, 11], lean: 0.17 },
];

const dominoClamp = (v) => Math.max(0, Math.min(1, v));
const dominoEase = (v) => { const t = dominoClamp(v); return t * t * t * (t * (t * 6 - 15) + 10); };

// All geometry lives on parallel planes in Anatomy's camera. The calibrated
// outlines retain the selected image's progressively leaning card silhouettes.
function dominoWorld([sx, sy], z) {
  const { origin } = DOMINO_CAMERA;
  const { sinA, cosA, sinE, cosE, k: scale } = k.cameraOf(DOMINO_CAMERA);
  const a = (sx - origin[0]) / scale;
  const b = ((sy - origin[1]) / scale + z * cosE) / sinE;
  return [sinA * a + cosA * b, -cosA * a + sinA * b];
}

const dominoOutline = k.roundedPlan({ x: 0, y: 0, w: 140, d: 250, r: 21 }, 18);
const dominoRest = DOMINO_CARDS.map((card) => {
  const onFace = ([x, y]) => dominoWorld([
    380 + (card.corner[0] + card.across[0] * x / 140 + card.down[0] * y / 250 - 380) * DOMINO_CAMERA.scale,
    270 + (card.corner[1] + card.across[1] * x / 140 + card.down[1] * y / 250 - 270) * DOMINO_CAMERA.scale,
  ], card.z + 3.2);
  return { ring: dominoOutline.map(onFace), pivot: onFace([70, 250]) };
});

function dominoAt(milliseconds) {
  const t = Math.max(0, Math.min(DOMINO_DURATION, milliseconds));
  const shares = DOMINO_CARDS.map((_, i) => {
    const opened = dominoEase((t - 1200 - i * 260) / 1700);
    const closed = dominoEase((t - 4400 - i * 220) / 1700);
    return opened * (1 - closed);
  });
  const phase = t < 1200 || t >= 6540 ? 'Together' : t < 3420 ? 'Unfolding' : t < 4400 ? 'A little momentum' : 'Coming together';
  return { time: t, phase, shares };
}

function dominoGeometry(index, share) {
  const card = DOMINO_CARDS[index];
  const { ring, pivot } = dominoRest[index];
  const angle = card.lean * share;
  const c = Math.cos(angle), s = Math.sin(angle);
  const shiftTo = dominoWorld([380 + card.shift[0] * share, 270 + card.shift[1] * share], 0);
  const shiftFrom = dominoWorld([380, 270], 0);
  const rotated = ring.map(([x, y]) => [
    pivot[0] + (x - pivot[0]) * c - (y - pivot[1]) * s + shiftTo[0] - shiftFrom[0],
    pivot[1] + (x - pivot[0]) * s + (y - pivot[1]) * c + shiftTo[1] - shiftFrom[1],
  ]);
  return k.extrude(rotated, card.z, 3.2, DOMINO_CAMERA);
}

function dominoCardSvg(index, share = 0) {
  return `<g data-card="${index}" style="--card-color:${DOMINO_CARDS[index].color}">${k.solidSvg(dominoGeometry(index, share), { crease: 'none' })}</g>`;
}

const dominoFigure = document.querySelector('.motion');
const dominoStage = document.querySelector('.stage');
const dominoSlider = document.querySelector('#timeline');
const dominoPlay = document.querySelector('#play');
const dominoReplay = document.querySelector('#replay');
const dominoReadout = document.querySelector('[data-readout]');
const dominoElapsed = document.querySelector('#elapsed');
const dominoAnnouncement = document.querySelector('#announcement');
const dominoReduced = matchMedia('(prefers-reduced-motion: reduce)');
const dominoSystemTheme = matchMedia('(prefers-color-scheme: dark)');
const dominoTheme = document.querySelector('#theme');
const dominoNodes = [...document.querySelectorAll('[data-card]')].map((node) => {
  const top = node.querySelector('.iso-top');
  const shades = Array.from({ length: 4 }, (_, shade) => {
    let path = node.querySelector(`.iso-shade[data-shade="${shade}"]`);
    if (!path) {
      path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'iso-shade');
      path.dataset.shade = String(shade);
      top.before(path);
    }
    return path;
  });
  return { fill: node.querySelector('.iso-fill'), top, edge: node.querySelector('.iso-edge'), shades };
});

let dominoTime = 0, dominoFrame = 0, dominoLast = 0;
let dominoPlaying = !dominoReduced.matches, dominoVisible = false, dominoManualTheme = false;

function dominoDescribe() {
  dominoSlider.setAttribute('aria-valuetext', `${(dominoTime / 1000).toFixed(1)} seconds of 8.6 seconds. ${dominoAt(dominoTime).phase}.`);
}

function dominoDraw() {
  const state = dominoAt(dominoTime);
  dominoNodes.forEach((nodes, index) => {
    const shape = dominoGeometry(index, state.shares[index]);
    nodes.fill.setAttribute('d', shape.fill);
    nodes.top.setAttribute('d', shape.top);
    nodes.edge.setAttribute('d', shape.outline);
    nodes.shades.forEach((node) => node.setAttribute('d', shape.shades[Number(node.dataset.shade)]));
  });
  dominoSlider.value = String(Math.round(dominoTime));
  dominoSlider.style.setProperty('--progress', `${dominoTime / DOMINO_DURATION * 100}%`);
  dominoElapsed.textContent = `${(dominoTime / 1000).toFixed(1)} / 8.6s`;
  dominoReadout.textContent = state.phase;
  dominoFigure.dataset.time = dominoTime.toFixed(1);
  dominoDescribe();
}

function dominoSync() {
  const running = dominoPlaying && dominoVisible && !document.hidden && !dominoReduced.matches;
  dominoFigure.dataset.playing = String(dominoPlaying);
  dominoFigure.dataset.running = String(running);
  dominoPlay.disabled = dominoReduced.matches;
  dominoPlay.setAttribute('aria-label', dominoPlaying ? 'Pause animation' : 'Play animation');
  dominoPlay.querySelector('span').textContent = dominoPlaying ? 'Pause' : 'Play';
  dominoPlay.dataset.playing = String(dominoPlaying);
  document.querySelector('#hint').textContent = dominoReduced.matches
    ? 'Reduced motion · Drag the timeline or use ← → to inspect'
    : 'Space to play / pause · ← → to step · R to replay';
  if (!running && dominoFrame) {
    cancelAnimationFrame(dominoFrame);
    dominoFrame = 0;
  }
  if (running && !dominoFrame) {
    dominoLast = 0;
    dominoFrame = requestAnimationFrame(dominoTick);
  }
}

function dominoTick(now) {
  const dt = dominoLast ? Math.min(now - dominoLast, 1000 / 30) : 0;
  dominoLast = now;
  dominoTime = (dominoTime + dt) % DOMINO_DURATION;
  dominoDraw();
  dominoFrame = requestAnimationFrame(dominoTick);
}

function dominoSetTime(value) {
  dominoPlaying = false;
  dominoTime = Math.max(0, Math.min(DOMINO_DURATION, value));
  dominoDraw();
  dominoDescribe();
  dominoSync();
}

function dominoToggle() {
  if (dominoReduced.matches) return;
  dominoPlaying = !dominoPlaying;
  dominoAnnouncement.textContent = dominoPlaying ? 'Playing.' : 'Paused.';
  dominoDescribe();
  dominoSync();
}

function dominoRestart() {
  dominoTime = 0;
  dominoPlaying = !dominoReduced.matches;
  dominoLast = 0;
  dominoDraw();
  dominoDescribe();
  dominoAnnouncement.textContent = dominoReduced.matches ? 'Together. Timeline at the start.' : 'Replaying.';
  dominoSync();
}

dominoPlay.addEventListener('click', dominoToggle);
dominoReplay.addEventListener('click', dominoRestart);
dominoSlider.addEventListener('input', () => dominoSetTime(Number(dominoSlider.value)));
dominoSlider.addEventListener('focus', () => { dominoPlaying = false; dominoDescribe(); dominoSync(); });
dominoSlider.addEventListener('pointerdown', () => { dominoPlaying = false; dominoSync(); dominoDescribe(); });
dominoFigure.addEventListener('keydown', (event) => {
  const button = event.target.closest('button');
  if (event.key === ' ' || event.key === 'Enter') {
    if (button) return;
    event.preventDefault();
    dominoToggle();
  } else if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    dominoSetTime(dominoTime + (event.key === 'ArrowRight' ? 1 : -1) * (event.shiftKey ? 500 : 100));
  } else if (event.key === 'Home' || event.key === 'End') {
    event.preventDefault();
    dominoSetTime(event.key === 'Home' ? 0 : DOMINO_DURATION);
  } else if (event.key.toLowerCase() === 'r' && !event.metaKey && !event.ctrlKey && !event.altKey) {
    event.preventDefault();
    dominoRestart();
  } else if (event.key === 'Escape') {
    dominoPlaying = false;
    dominoDescribe();
    dominoSync();
  }
});

new IntersectionObserver((entries) => {
  const entry = entries[entries.length - 1];
  dominoVisible = entry.isIntersecting && entry.intersectionRatio > 0;
  dominoSync();
}).observe(dominoStage);
document.addEventListener('visibilitychange', dominoSync);
dominoReduced.addEventListener('change', () => {
  if (dominoReduced.matches) dominoPlaying = false;
  dominoDescribe();
  dominoSync();
});

function dominoSetTheme(dark) {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  dominoTheme.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  dominoTheme.querySelector('span').textContent = dark ? 'Light' : 'Dark';
}
dominoTheme.addEventListener('click', () => {
  dominoManualTheme = true;
  dominoSetTheme(document.documentElement.dataset.theme !== 'dark');
});
dominoSystemTheme.addEventListener('change', () => { if (!dominoManualTheme) dominoSetTheme(dominoSystemTheme.matches); });
dominoSetTheme(dominoSystemTheme.matches);
dominoDraw();
dominoDescribe();
dominoSync();
</script></body></html>
